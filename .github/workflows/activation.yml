name: Get Activation File v2

on:
  workflow_dispatch:

jobs:
  get-alf:
    runs-on: ubuntu-latest
    steps:
    - name: Request activation file
      id: activation
      uses: game-ci/unity-request-activation-file@v4
      with:
        unityVersion: 2022.3.20f1

    - name: Upload .alf file
      uses: actions/upload-artifact@v4
      with:
        name: Unity_v2022.3.20f1.alf
        path: ${{ steps.activation.outputs.filePath }}
        retention-days: 90
