name: Get Activation File (Docker)

on:
  workflow_dispatch:

jobs:
  get-alf:
    runs-on: ubuntu-latest
    steps:
    - name: Generate .alf file using Docker
      run: |
        # Try different image tags
        IMAGE=""
        for tag in \
          "unityci/editor:ubuntu-2022.3.20f1-android-3" \
          "unityci/editor:ubuntu-2022.3.20f1-android" \
          "unityci/editor:ubuntu-2022.3.20f1-base-3" \
          "unityci/editor:ubuntu-2022.3.20f1-base" \
          "ghcr.io/game-ci/editor:2022.3.20f1-android-3" \
          "ghcr.io/game-ci/editor:2022.3.20f1-android" \
          "ghcr.io/game-ci/editor:2022.3.20f1-base-3" \
          "ghcr.io/game-ci/editor:2022.3.20f1-base"; do
          echo "Trying $tag..."
          if docker pull "$tag" 2>&1; then
            echo "SUCCESS: $tag"
            IMAGE="$tag"
            break
          fi
        done
        
        if [ -z "$IMAGE" ]; then
          echo "ERROR: No Unity Docker image found"
          exit 1
        fi
        
        # Run activation in Docker
        docker run --rm \
          -v $(pwd):/output \
          -w /output \
          "$IMAGE" \
          bash -c "unity -batchmode -nographics -createManualActivationFile -logFile /dev/stdout 2>&1 || true; find /output -name '*.alf' -ls"
        
        # Find the .alf file
        echo "Looking for .alf files..."
        find . -name "*.alf" -type f -ls
        ls -la *.alf 2>/dev/null || echo "No .alf file found in current dir"

    - name: Upload .alf file
      uses: actions/upload-artifact@v4
      with:
        name: Unity_Activation.alf
        path: "*.alf"
        retention-days: 90
