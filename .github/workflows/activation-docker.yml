name: Get Activation File (Docker)

on:
  workflow_dispatch:

jobs:
  get-alf:
    runs-on: ubuntu-latest
    steps:
    - name: Generate .alf file using Docker
      run: |
        # Pull Unity Docker image
        docker pull unityci/editor:ubuntu-2022.3.20f1-android-3
        
        # Run activation in Docker
        docker run --rm \
          -v $(pwd):/output \
          -w /output \
          unityci/editor:ubuntu-2022.3.20f1-android-3 \
          bash -c "/opt/unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logFile /dev/stdout 2>&1 || true; echo '---'; find /output -name '*.alf' -ls; find /root -name '*.alf' -ls; find /tmp -name '*.alf' -ls; find /opt -name '*.alf' -ls"
        
        # Find the .alf file
        echo "Looking for .alf files..."
        find . -name "*.alf" -type f -ls
        ls -la *.alf 2>/dev/null || echo "No .alf file found in current dir"

    - name: Upload .alf file
      uses: actions/upload-artifact@v4
      with:
        name: Unity_Activation.alf
        path: "*.alf"
        retention-days: 90
