name: Build with Docker Unity

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        docker image prune -a -f
        df -h

    - name: Create Unity project structure
      run: |
        mkdir -p UnityProject/Assets/Scripts
        mkdir -p UnityProject/Assets/Plugins/Android/arm64-v8a
        mkdir -p UnityProject/Assets/Plugins/Android/armeabi-v7a
        mkdir -p UnityProject/Assets/Resources
        mkdir -p UnityProject/Assets/Scenes
        mkdir -p UnityProject/ProjectSettings
        
        # Copy scripts
        cp -r Assets/Scripts/* UnityProject/Assets/Scripts/ 2>/dev/null || true
        
        # Copy resources
        cp -r Assets/Resources/* UnityProject/Assets/Resources/ 2>/dev/null || true
        
        # Copy native libs
        cp lib/armeabi-v7a/*.so UnityProject/Assets/Plugins/Android/armeabi-v7a/ 2>/dev/null || true
        
        # Create minimal scene
        cat > UnityProject/Assets/Scenes/MainScene.unity << 'SCENE'
        %YAML 1.1
        %TAG !u! tag:unity3d.com,2011:
        --- !u!29 &1
        OcclusionCullingSettings:
          m_ObjectHideFlags: 0
          serializedVersion: 2
          m_OcclusionBakeSettings:
            smallestOccluder: 5
            smallestHole: 0.25
            backfaceThreshold: 100
          m_SceneGUID: 00000000000000000000000000000000
          m_OcclusionCullingData: {fileID: 0}
        --- !u!104 &2
        RenderSettings:
          m_ObjectHideFlags: 0
          serializedVersion: 9
          m_Fog: 0
          m_FogColor: {r: 0.5, g: 0.5, b: 0.5, a: 1}
          m_FogMode: 3
          m_FogDensity: 0.01
          m_LinearFogStart: 0
          m_LinearFogEnd: 300
          m_AmbientSkyColor: {r: 0.212, g: 0.227, b: 0.259, a: 1}
          m_AmbientEquatorColor: {r: 0.114, g: 0.125, b: 0.133, a: 1}
          m_AmbientGroundColor: {r: 0.047, g: 0.043, b: 0.035, a: 1}
          m_AmbientIntensity: 1
          m_AmbientMode: 3
          m_SubtractiveShadowColor: {r: 0.42, g: 0.478, b: 0.627, a: 1}
          m_SkyboxMaterial: {fileID: 0}
          m_HaloStrength: 0.5
          m_FlareStrength: 1
          m_FlareFadeSpeed: 3
          m_HaloTexture: {fileID: 0}
          m_SpotCookie: {fileID: 10001, guid: 0000000000000000e000000000000000, type: 0}
          m_DefaultReflectionMode: 0
          m_DefaultReflectionResolution: 128
          m_ReflectionBounces: 1
          m_ReflectionIntensity: 1
          m_CustomReflection: {fileID: 0}
          m_Sun: {fileID: 0}
          m_IndirectSpecularColor: {r: 0, g: 0, b: 0, a: 1}
          m_UseRadianceAmbientProbe: 0
        --- !u!157 &3
        LightmapSettings:
          m_ObjectHideFlags: 0
          serializedVersion: 12
          m_GIWorkflowMode: 1
          m_EnableBakedLightmaps: 0
          m_EnableRealtimeLightmaps: 0
        SCENE
        
        # Create ProjectSettings
        cat > UnityProject/ProjectSettings/ProjectSettings.asset << 'EOF'
        %YAML 1.1
        %TAG !u! tag:unity3d.com,2011:
        --- !u!129 &1
        PlayerSettings:
          productName: Undead Slayer Xiahoudun
          companyName: NHN Corp
          defaultScreenWidth: 1920
          defaultScreenHeight: 1080
          bundleVersion: 3.5.0
          AndroidBundleVersionCode: 1
          AndroidMinSdkVersion: 22
          AndroidTargetSdkVersion: 33
          AndroidTargetArchitectures: 3
          applicationIdentifier:
            Android: com.nhncorp.skundeadck
        EOF
        
        echo "Project structure created"
        find UnityProject -type f | wc -l

    - name: Build with Unity Docker
      run: |
        # Pull Unity Docker image
        docker pull unityci/editor:ubuntu-2022.3.20f1-android-3.0.0
        
        # Run build in Docker
        docker run --rm \
          -v $(pwd)/UnityProject:/project \
          -v $(pwd)/build:/output \
          unityci/editor:ubuntu-2022.3.20f1-android-3.0.0 \
          bash -c "
            cd /project && \
            unity -batchmode -nographics -quit \
              -projectPath /project \
              -buildTarget Android \
              -executeMethod UnityEditor.BuildPipeline.BuildPlayer \
              -logFile /dev/stdout || true
          "

    - name: Check build output
      run: |
        ls -la build/ 2>/dev/null || echo "No build output found"
        find . -name "*.apk" 2>/dev/null

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: UndeadSlayer-arm64
        path: build/**/*.apk
        retention-days: 30
