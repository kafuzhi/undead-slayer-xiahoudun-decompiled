name: Auto Build ARM64

on:
  workflow_dispatch:

jobs:
  activate-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Request activation file
      id: activation
      uses: game-ci/unity-request-activation-file@v2
      with:
        unityVersion: 2022.3.20f1

    - name: Upload .alf file
      uses: actions/upload-artifact@v4
      with:
        name: unity-activation-file
        path: ${{ steps.activation.outputs.filePath }}

    - name: Activate Unity (Personal)
      if: ${{ secrets.UNITY_LICENSE != '' }}
      uses: game-ci/unity-activate@v2
      with:
        unityVersion: 2022.3.20f1

    - name: Build Android ARM64
      if: ${{ secrets.UNITY_LICENSE != '' }}
      uses: game-ci/unity-builder@v4
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      with:
        targetPlatform: Android
        unityVersion: 2022.3.20f1

    - name: Upload APK
      if: ${{ secrets.UNITY_LICENSE != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: UndeadSlayer-arm64
        path: build/Android/Android.apk
